<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGXEN | Admin Control</title>
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.85);
            --text: #ffffff;
            --accent: #00ff88;
            --error: #ff4d4d;
            --warn: #ffae00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: radial-gradient(circle at center, #151515 0%, #000000 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .header h1 { color: var(--accent); font-size: 28px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }

        /* --- Master Key Section --- */
        .section-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .section-card h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.6); border: 1px solid #333;
            color: var(--accent); border-radius: 8px; outline: none; font-family: monospace; font-size: 15px; font-weight: bold;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,136,0.2); }

        .btn {
            padding: 12px 20px; background: var(--accent); color: #000; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #ffffff; }

        /* Master Key List */
        .mk-list { display: flex; flex-direction: column; gap: 10px; }
        .mk-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); border: 1px solid #222; padding: 12px 15px; border-radius: 8px;
        }
        .mk-text { color: var(--text); font-family: monospace; font-size: 15px; }
        .mk-del { background: transparent; color: var(--error); border: none; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .mk-del:hover { transform: scale(1.2); }

        /* --- User List Section --- */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .user-card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px 15px 15px 15px; /* Top padding extra for the absolute buttons */
            position: relative;
            transition: 0.3s;
        }
        .user-card:hover { border-color: rgba(255,255,255,0.2); }
        .user-card.banned { border-color: var(--error); background: rgba(30, 5, 5, 0.9); }
        
        .user-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        .banned .user-name { color: var(--error); }
        
        .user-id { font-size: 11px; color: #666; font-family: monospace; word-break: break-all; margin-bottom: 15px; }
        
        .user-date { font-size: 12px; color: #888; position: absolute; top: 12px; left: 15px; }
        
        /* Trash Button at Top Right */
        .trash-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            filter: grayscale(100%);
        }
        .trash-btn:hover { filter: grayscale(0%); transform: scale(1.1); }

        .btn-ban { background: var(--warn); width: 100%; border-radius: 6px; padding: 10px; }
        .btn-unban { background: var(--accent); width: 100%; border-radius: 6px; padding: 10px; }

        #statusMsg { text-align: center; margin-top: 10px; font-size: 14px; height: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DGXEN Admin</h1>
        <p>Security & Access Control Panel</p>
    </div>

    <div class="container">
        
        <!-- Master Keys Control -->
        <div class="section-card">
            <h2>Manage Master Keys</h2>
            <div class="input-group">
                <input type="text" id="masterKeyInput" placeholder="Add new master key (e.g., DGXEN-VIP-1)">
                <button class="btn" onclick="addMasterKey()">ADD KEY</button>
            </div>
            <div id="statusMsg"></div>
            <div class="mk-list" id="masterKeysList">
                <p style="color: #666; text-align: center;">Loading keys...</p>
            </div>
        </div>

        <!-- Users Management -->
        <div class="section-card">
            <h2>Registered Devices (<span id="userCount">0</span>)</h2>
            <div class="user-grid" id="userList">
                <p style="color: #666; text-align: center;">Loading users...</p>
            </div>
        </div>

    </div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, remove, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://login-pass-1a196-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- Master Key Logic (Multi-Key Support) ---
    const keysRef = ref(db, 'settings/masterKeys');

    onValue(keysRef, (snapshot) => {
        const listDiv = document.getElementById('masterKeysList');
        listDiv.innerHTML = '';
        if (snapshot.exists()) {
            const data = snapshot.val();
            Object.keys(data).forEach(pushId => {
                const keyStr = data[pushId];
                listDiv.innerHTML += `
                    <div class="mk-item">
                        <span class="mk-text">${keyStr}</span>
                        <button class="mk-del" title="Delete Key" onclick="deleteMasterKey('${pushId}')">🗑️</button>
                    </div>
                `;
            });
        } else {
            listDiv.innerHTML = '<p style="color: #666; text-align: center;">No Master Keys setup yet.</p>';
        }
    });

    window.addMasterKey = async function() {
        const newKey = document.getElementById('masterKeyInput').value.trim();
        const msg = document.getElementById('statusMsg');
        if(!newKey) {
            msg.style.color = "var(--error)"; msg.innerText = "Key cannot be empty!"; return;
        }
        try {
            await push(ref(db, 'settings/masterKeys'), newKey);
            document.getElementById('masterKeyInput').value = '';
            msg.style.color = "var(--accent)"; msg.innerText = "Key Added!";
            setTimeout(() => msg.innerText = "", 2000);
        } catch(e) {
            msg.style.color = "var(--error)"; msg.innerText = "Failed to add key.";
        }
    }

    window.deleteMasterKey = async function(pushId) {
        if(confirm("Delete this master key? Users with this key will instantly lose access.")) {
            await remove(ref(db, 'settings/masterKeys/' + pushId));
        }
    }

    // --- User Management Logic ---
    const usersRef = ref(db, 'users');

    onValue(usersRef, (snapshot) => {
        const userListDiv = document.getElementById('userList');
        const userCountSpan = document.getElementById('userCount');
        userListDiv.innerHTML = ''; 

        if (!snapshot.exists()) {
            userListDiv.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">Database is clean.</p>';
            userCountSpan.innerText = "0";
            return;
        }

        const data = snapshot.val();
        const users = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        users.sort((a, b) => new Date(b.joined) - new Date(a.joined)); // Newest first
        userCountSpan.innerText = users.length;

        users.forEach(user => {
            const isBanned = user.status === 'banned';
            const dateStr = new Date(user.joined).toLocaleDateString();

            // TRASH BUTTON LOGIC: Sirf tab render hoga jab user banned hoga
            const trashButtonHTML = isBanned ? 
                `<button class="trash-btn" title="Permanently Delete User" onclick="deleteUser('${user.id}')">🗑️</button>` : '';

            const card = document.createElement('div');
            card.className = `user-card ${isBanned ? 'banned' : ''}`;
            
            card.innerHTML = `
                ${trashButtonHTML}
                <div class="user-date">${dateStr}</div>
                <div class="user-name">${user.name}</div>
                <div class="user-id">ID: ${user.id}</div>
                <div style="display: flex;">
                    <button class="btn ${isBanned ? 'btn-unban' : 'btn-ban'}" 
                        onclick="toggleBan('${user.id}', '${isBanned ? 'active' : 'banned'})'">
                        ${isBanned ? 'UNBAN' : 'BAN USER'}
                    </button>
                </div>
            `;
            userListDiv.appendChild(card);
        });
    });

    window.toggleBan = async function(userId, newStatus) {
        try {
            await set(ref(db, 'users/' + userId + '/status'), newStatus);
        } catch (error) {
            alert("Error updating status!");
        }
    }

    window.deleteUser = async function(userId) {
        const confirmDelete = confirm("Permanently delete this banned user?");
        if(confirmDelete) {
            try { await remove(ref(db, 'users/' + userId)); } 
            catch (error) { alert("Error deleting user!"); }
        }
    }
</script>
</body>
</html>
