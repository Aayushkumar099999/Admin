<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | DGXEN</title>
    <style>
        :root { --bg: #000000; --card: #121212; --text: #ffffff; --accent: #00ff88; --error: #ff4444; }
        
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            padding: 20px; margin: 0;
        }

        .container { max-width: 900px; margin: 40px auto; }
        
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 24px; }

        .card { 
            background: var(--card); border: 1px solid #222; border-radius: 20px; 
            padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        h2 { color: var(--accent); margin-top: 0; font-size: 18px; margin-bottom: 20px; }

        /* Inputs & Buttons */
        .input-group { display: flex; gap: 15px; margin-bottom: 10px; }
        input { 
            flex-grow: 1; padding: 15px; background: #000; border: 1px solid #333; 
            color: white; border-radius: 12px; font-size: 16px; 
        }
        input:focus { outline: none; border-color: var(--accent); }
        
        .btn { 
            padding: 15px 25px; background: #fff; color: #000; border: none; 
            border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        .btn:hover { background: var(--accent); transform: scale(1.02); }

        /* Table Styles */
        .table-wrapper { overflow-x: auto; background: #000; border-radius: 12px; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; }
        th { color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; background: #0a0a0a; }
        tr:hover { background: #1a1a1a; }
        
        .status-badge { 
            padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase;
        }
        .status-active { background: rgba(0, 255, 136, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .status-banned { background: rgba(255, 68, 68, 0.1); color: var(--error); border: 1px solid var(--error); }

        .action-btn { 
            padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .ban-btn { background: var(--error); color: white; }
        .ban-btn:hover { background: #cc0000; }
        .unban-btn { background: #444; color: white; }
        .unban-btn:hover { background: #666; }

        .user-count { float: right; color: #888; font-size: 14px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DGXEN Admin Control</h1>
    </div>

    <!-- MASTER KEY SECTION -->
    <div class="card">
        <h2>Update Universal Master Key</h2>
        <div class="input-group">
            <input type="text" id="masterKeyInput" placeholder="Enter new master key (e.g. DGXEN-VIP-100)">
            <button class="btn" onclick="updateMasterKey()">SET KEY</button>
        </div>
        <div id="keyStatus" style="font-size: 13px; color: #888; margin-top: 10px;">
            Current Master Key: <span id="currentKeyDisplay" style="color: white; font-weight: bold;">Loading...</span>
        </div>
    </div>

    <!-- USER MANAGEMENT SECTION -->
    <div class="card">
        <h2>
            User Management 
            <span class="user-count">Total Users: <b id="totalUsersCount" style="color:white;">0</b></span>
        </h2>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Device ID</th>
                        <th>Joined Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="5" style="text-align: center; color: #666;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Linked directly to your Firebase
    const firebaseConfig = {
        databaseURL: "https://login-pass-1a196-default-rtdb.firebaseio.com/"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- MASTER KEY LOGIC ---
    const keyRef = ref(db, 'settings/masterKey');
    
    onValue(keyRef, (snapshot) => {
        const key = snapshot.val();
        document.getElementById('currentKeyDisplay').innerText = key ? key : "Not Set";
    });

    window.updateMasterKey = async function() {
        const input = document.getElementById('masterKeyInput').value.trim();
        
        if (!input) {
            alert("Key cannot be empty!");
            return;
        }

        try {
            await set(ref(db, 'settings/masterKey'), input);
            document.getElementById('masterKeyInput').value = ""; 
            alert("Master Key updated successfully! ✅");
        } catch (error) {
            alert("Error updating key: " + error.message);
        }
    }

    // --- USER MANAGEMENT LOGIC ---
    const usersRef = ref(db, 'users');

    onValue(usersRef, (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('userTableBody');
        const countDisplay = document.getElementById('totalUsersCount');
        
        tbody.innerHTML = ""; 

        if (!users) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">No users found.</td></tr>';
            countDisplay.innerText = "0";
            return;
        }

        const userIds = Object.keys(users);
        countDisplay.innerText = userIds.length; 

        userIds.forEach(id => {
            const user = users[id];
            const isBanned = user.status === 'banned';
            
            let dateStr = "Unknown";
            if (user.joined) {
                const dateObj = new Date(user.joined);
                dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString();
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: white;">${user.name || 'Unknown'}</td>
                <td style="color: #888; font-family: monospace; font-size: 12px;">${id.substring(0, 15)}...</td>
                <td style="color: #888;">${dateStr}</td>
                <td>
                    <span class="status-badge ${isBanned ? 'status-banned' : 'status-active'}">
                        ${isBanned ? 'Banned' : 'Active'}
                    </span>
                </td>
                <td>
                    <button class="action-btn ${isBanned ? 'unban-btn' : 'ban-btn'}" 
                        onclick="toggleBan('${id}', '${user.status}')">
                        ${isBanned ? 'UNBAN USER' : 'BAN DEVICE'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    window.toggleBan = async function(deviceId, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'banned' : 'active';
        const confirmMsg = currentStatus === 'active' ? 
            "Are you sure you want to BAN this user?" : "Are you sure you want to UNBAN this user?";

        if(confirm(confirmMsg)) {
            try {
                await update(ref(db, 'users/' + deviceId), {
                    status: newStatus
                });
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        }
    }
</script>
</body>
</html>
