<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGXEN | Admin Control</title>
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.8);
            --text: #ffffff;
            --accent: #00ff88;
            --error: #ff4d4d;
            --warn: #ffae00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: radial-gradient(circle at top, #111 0%, #000 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 { color: var(--accent); font-size: 28px; letter-spacing: 2px; text-transform: uppercase; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* --- Master Key Section --- */
        .section-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .section-card h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid #333;
            color: white; border-radius: 8px; outline: none; font-family: monospace; font-size: 16px;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .btn {
            padding: 12px 20px; background: var(--accent); color: #000; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #ffffff; }
        
        .btn-ban { background: var(--warn); }
        .btn-unban { background: var(--accent); }
        .btn-delete { background: var(--error); color: white; }

        /* --- User List Section --- */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .user-card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            position: relative;
            transition: 0.3s;
        }
        .user-card:hover { border-color: rgba(255,255,255,0.2); }

        .user-card.banned { border-color: var(--error); background: rgba(30, 5, 5, 0.9); }
        
        .user-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        .banned .user-name { color: var(--error); }
        
        .user-id { font-size: 11px; color: #666; font-family: monospace; word-break: break-all; margin-bottom: 15px; }
        .user-date { font-size: 12px; color: #888; position: absolute; top: 15px; right: 15px; }

        .action-buttons { display: flex; gap: 8px; }
        .action-buttons button { flex: 1; padding: 8px; font-size: 13px; border-radius: 6px; }

        #statusMsg { text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DGXEN Admin</h1>
        <p>Security & Access Control Panel</p>
    </div>

    <div class="container">
        
        <!-- Master Key Control -->
        <div class="section-card">
            <h2>Set Master VIP Key</h2>
            <div class="input-group">
                <input type="text" id="masterKeyInput" placeholder="Enter new master key (e.g., DGXEN-VIP-1)">
                <button class="btn" onclick="updateMasterKey()">UPDATE KEY</button>
            </div>
            <div id="statusMsg"></div>
        </div>

        <!-- Users Management -->
        <div class="section-card">
            <h2>Registered Devices (<span id="userCount">0</span>)</h2>
            <div class="user-grid" id="userList">
                <!-- User cards will load here -->
                <p style="color: #666;">Loading users...</p>
            </div>
        </div>

    </div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://login-pass-1a196-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- Master Key Logic ---
    window.updateMasterKey = async function() {
        const newKey = document.getElementById('masterKeyInput').value.trim();
        const msg = document.getElementById('statusMsg');
        
        if(!newKey) {
            msg.style.color = "var(--error)";
            msg.innerText = "Key cannot be empty!";
            return;
        }

        try {
            await set(ref(db, 'settings/masterKey'), newKey);
            msg.style.color = "var(--accent)";
            msg.innerText = "Master Key Updated Successfully!";
            setTimeout(() => msg.innerText = "", 3000);
        } catch(e) {
            msg.style.color = "var(--error)";
            msg.innerText = "Failed to update key.";
        }
    }

    // Fetch existing Master Key on load
    get(ref(db, 'settings/masterKey')).then((snapshot) => {
        if(snapshot.exists()) {
            document.getElementById('masterKeyInput').value = snapshot.val();
        }
    });

    // --- User Management Logic ---
    const usersRef = ref(db, 'users');

    onValue(usersRef, (snapshot) => {
        const userListDiv = document.getElementById('userList');
        const userCountSpan = document.getElementById('userCount');
        userListDiv.innerHTML = ''; 

        if (!snapshot.exists()) {
            userListDiv.innerHTML = '<p style="color: #666;">No users found. Database is clean.</p>';
            userCountSpan.innerText = "0";
            return;
        }

        const data = snapshot.val();
        const users = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        // Sort newest first
        users.sort((a, b) => new Date(b.joined) - new Date(a.joined));
        
        userCountSpan.innerText = users.length;

        users.forEach(user => {
            const isBanned = user.status === 'banned';
            const dateStr = new Date(user.joined).toLocaleDateString();

            const card = document.createElement('div');
            card.className = `user-card ${isBanned ? 'banned' : ''}`;
            
            card.innerHTML = `
                <div class="user-date">${dateStr}</div>
                <div class="user-name">${user.name}</div>
                <div class="user-id">ID: ${user.id}</div>
                <div class="action-buttons">
                    <button class="btn ${isBanned ? 'btn-unban' : 'btn-ban'}" 
                        onclick="toggleBan('${user.id}', '${isBanned ? 'active' : 'banned'}')">
                        ${isBanned ? 'UNBAN' : 'BAN'}
                    </button>
                    <button class="btn btn-delete" onclick="deleteUser('${user.id}')">DELETE</button>
                </div>
            `;
            userListDiv.appendChild(card);
        });
    });

    // Ban / Unban Function
    window.toggleBan = async function(userId, newStatus) {
        try {
            await set(ref(db, 'users/' + userId + '/status'), newStatus);
        } catch (error) {
            alert("Error updating status!");
        }
    }

    // Delete (Clean) Function
    window.deleteUser = async function(userId) {
        const confirmDelete = confirm("Are you sure you want to permanently delete this user? This will clean their data.");
        if(confirmDelete) {
            try {
                await remove(ref(db, 'users/' + userId));
            } catch (error) {
                alert("Error deleting user!");
            }
        }
    }
</script>
</body>
</html>

    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Linked directly to your Firebase
    const firebaseConfig = {
        databaseURL: "https://login-pass-1a196-default-rtdb.firebaseio.com/"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- MASTER KEY LOGIC ---
    const keyRef = ref(db, 'settings/masterKey');
    
    onValue(keyRef, (snapshot) => {
        const key = snapshot.val();
        document.getElementById('currentKeyDisplay').innerText = key ? key : "Not Set";
    });

    window.updateMasterKey = async function() {
        const input = document.getElementById('masterKeyInput').value.trim();
        
        if (!input) {
            alert("Key cannot be empty!");
            return;
        }

        try {
            await set(ref(db, 'settings/masterKey'), input);
            document.getElementById('masterKeyInput').value = ""; 
            alert("Master Key updated successfully! ✅");
        } catch (error) {
            alert("Error updating key: " + error.message);
        }
    }

    // --- USER MANAGEMENT LOGIC ---
    const usersRef = ref(db, 'users');

    onValue(usersRef, (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('userTableBody');
        const countDisplay = document.getElementById('totalUsersCount');
        
        tbody.innerHTML = ""; 

        if (!users) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">No users found.</td></tr>';
            countDisplay.innerText = "0";
            return;
        }

        const userIds = Object.keys(users);
        countDisplay.innerText = userIds.length; 

        userIds.forEach(id => {
            const user = users[id];
            const isBanned = user.status === 'banned';
            
            let dateStr = "Unknown";
            if (user.joined) {
                const dateObj = new Date(user.joined);
                dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString();
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: white;">${user.name || 'Unknown'}</td>
                <td style="color: #888; font-family: monospace; font-size: 12px;">${id.substring(0, 15)}...</td>
                <td style="color: #888;">${dateStr}</td>
                <td>
                    <span class="status-badge ${isBanned ? 'status-banned' : 'status-active'}">
                        ${isBanned ? 'Banned' : 'Active'}
                    </span>
                </td>
                <td>
                    <button class="action-btn ${isBanned ? 'unban-btn' : 'ban-btn'}" 
                        onclick="toggleBan('${id}', '${user.status}')">
                        ${isBanned ? 'UNBAN USER' : 'BAN DEVICE'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    window.toggleBan = async function(deviceId, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'banned' : 'active';
        const confirmMsg = currentStatus === 'active' ? 
            "Are you sure you want to BAN this user?" : "Are you sure you want to UNBAN this user?";

        if(confirm(confirmMsg)) {
            try {
                await update(ref(db, 'users/' + deviceId), {
                    status: newStatus
                });
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        }
    }
</script>
</body>
</html>
